<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=360, height=780, initial-scale=1.0">
    <title>Search Words</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            width: 300px;
            height: 700px;
            margin: 0 auto;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }
        .search-box {
            margin-bottom: 10px;
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .word-list {
            margin-top: 10px;
            list-style-type: none;
            padding: 0;
        }
        .word-list li {
            padding: 8px 10px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
            margin: 5px;
            background-color: #ffd1dc;
        }
        .word-list .details {
            display: none;
            margin-top: 5px;
            padding: 5px;
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 5px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
</head>
<body>
    <div class="container">
        <h2>Search</h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search word..." oninput="filterWords()">
        </div>
        <ul class="word-list" id="wordList">
            <li onclick="toggleDetails(this)">
                maison
                <div class="details">
                    <strong>Translation:</strong> house <br>
                    <strong>Example:</strong> La maison est grande. (The house is big.)
                </div>
            </li>
            <li onclick="toggleDetails(this)">
                bonjour
                <div class="details">
                    <strong>Translation:</strong> hello <br>
                    <strong>Example:</strong> Bonjour, comment ça va? (Hello, how are you?)
                </div>
            </li>
            <li onclick="toggleDetails(this)">
                chien
                <div class="details">
                    <strong>Translation:</strong> dog <br>
                    <strong>Example:</strong> Le chien est mignon. (The dog is cute.)
                </div>
            </li>
        </ul>
    </div>

    <script>

    </script>
</body>
</html>
